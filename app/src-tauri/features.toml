# 青丘湖硅基工坊 · 功能状态单一数据源
#
# 本文件是功能状态的唯一定义处，build.rs 会解析它并生成 Rust 常量，
# 前端通过 get_features 命令读取，禁止在代码或 UI 中硬编码功能可用性。
#
# status 取值：
#   committed   - 已排期，按里程碑交付
#   conditional - 依赖外部前置条件，前置未满足时以占位形式存在
#   deferred    - 明确延后，不排期，保留能力位
#   out         - 不做，不出现于界面
#
# placeholder 为占位文案，仅在 non-committed 时提供。

